[global]
    #### Server Identity
    name: WrongPC

    #### Indexing
    e2dsa, e2ts, e2vu  # All indexes! indexing, metadata, db patchings,

    #### User Interface
    #html-head: '<script src="/plugins/js/tl.js"></script><link rel="stylesheet" href="/plugins/css/style.css"/>'  # add these to the web UI html head
    #html-head: '<link rel="stylesheet" href="/plugins/css/style.css"/>'  # add these to the web UI html head
    lang: ind   # default language: ~~viking~~ Indonesian
    #themes: 11  # how many ranges of themes from 0 to n number we now have in total?
    #theme: 2    # Select start theme! default theme: protonmail-monokai
    #css-browser: plugins/css/bsod.css  # and here one of the custom theme we got.

    #### Connections
    # see https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers for list of common ports
    z, qr  # zeroconf, & QR code pls!!!!!!
    p: 80, 443  # listen on ports 80 and 443, not 3923
    #ftp: 20, 21
    ftp: 21  # enable FTP now! `: 3921`? nah.. standard port instead!
    ftps: 989  # also FTP TLS as well. requires `pyopenssl`
    tftp: 69  # oh, trivial ftp too! `: 3969`? nah.. standard port instead!
    sftp: 22  # SSH FTP?!?!?! https://copyparty.eu/cli/#g-sftp
    sftp-pw  # allow SSH login with password we got here
    #sftp-anon # allow anon access
    sftp-banner: landing/welcome.txt
    # Just add dhcp now you can PXE Boot!
    forget-ip: 43200  # forgor the ip after this second because doxxing uncontextually is not welcome on most realms & here.
    #smb  # Windows Samba?? this is bad idea..
    #smbw  # NO!! DO NOT LET WRITE!!!
    #### Oh shit! Samba can only be done if pass hash is none!!!!
    #### `13:59:01.309 auth                  --smb can only be used when --ah-alg is none`
    zsv  # (SSDP) bro, why no Windows Explorer had any idea about our PC here?!??!
    opds  # E-reader supports!!!!!!!!!!!!!
    #xff-src: lan
    #xff-hdr: cf-connecting-ip  # for cloudflare tunnel
    # https://github.com/9001/copyparty/blob/hovudstraum/docs/xff.md

    #### Security
    ah-alg: argon2  # use argon2 password hashing
    chpw  # let the change password commence-able
    chpw-no: @kaorfa  # sike! but not for me!
    #chpw-db: .chpw  # put custom passwords in this folder pls.
    chpw-db: ~/copyparty/.secrets  # WTF?! `PermissionError: [Errno 13] Permission denied: '.chpw'`??!??!?!??!
    #### So.. python somehow has no access for change password db in this same folder if put on C:/ drive? I don't get it. try on your Linux?
    #### probably work if you put this repo in `~`.. Windows tho?? I have no idea how permission works for this one.
    usernames  # make sure auth is structured user:pass
    dont-ban: av  # don't ban admin in volume

    #### Experiences
    exp  # Markdown expression?!??!??!
    og  # horray opengraph!
    #og-ua: "(Discord|Twitter|Slack|Bluesky|Whatever|Copyparty)bot"  # only for these guys
    og-ua: (Discord|Twitter|Slack|Bluesky|Whatever|Copyparty)bot  # only for these guys
    #shr: /submit  # Share now place!
    dedup  # File deduplication iyey!
    #reflink  # make it Copy On Write but unfortunately this is OS dependent!
    magic  # detect for nameless upload filetype detection
    ups-when  # see when upload
    ups-who: 2  # everyone can see upload
    #j8  # Multithread!!!

    #### Logging, Boookeeping, Alerts, & Caches
    lo: .logs/cpp-%Y-%m%d.xz  # log to .logs here
    hist: .cache  # put the db right here on .cache pls
    rss  # RSS Feed, ON!
    ansi  # colors in log message?!??!??!??!?!??!?
    deps  # see status of dependencies of copyparty right now
    #stats  # OpenMetrics Stats pls!!! Just in case anyone wants it idk. But maybe just keep it off if not used since that's lag little bit.

