# Hey! You can create softlink to mounted media instead!
# KDE Plasma Dolphin: Go to designated local mount folder like `~/.local/mnt`, Right click, `+ Create New`, `🔗 Link to a file or directory`, name the symlink, set origin to your mounted disk path, OK
# shell: `ln -sf ~/.local/mnt/My_disk /run/media/loremIpsumGuy/My_disk`. `-s` is soft / symbolic, `-f` is update overwrite origin if symlink already exist or make new one if not yet.
# Btw, `mnt` is not exist on `~/.local` (only standard for `/` system root), so go make one first!
# And so, use those symlinks instead, no more possession trouble, because if the disk is unplugged, it should soft error missing origin instead.
#
# Btw, if you chose `mount --bind` method, then you have to add it to system-level autostart. This symlink seems much easier and more persistent out of the box.

# Hey! Linux & many UNIX-like OSes gates port for <=1024! Hence, non-root apps can only listen by > 1024.
# Please do follow below step if you see `Error 13: Permission Denied`
# We used direct those port numbers on respective protocols. Not a recommended practice https://serverfault.com/a/413442 , but, how do we know to do the same complex security measure as on those serverers?
# Well fucking lemme know would ya? in the mean time,
# setcap the Python & copyparty the `eip`, idk if this is good idea
# `sudo setcap 'cap_net_bind_service=+eip' /usr/bin/python3.14` because python itself will do the port punching.
# `sudo setcap 'cap_net_bind_service=+eip' /usr/bin/copyparty` just in case, for those who installed it through ALPM / pacman.
# Then run again, e.g.
# `copyparty -c conf/this-config.conf`
#
# You should otherwise never run this server as `root` (using `sudo copyparty ...`) as it will cause any incoming file belongs to `root` no matter what.
#
# Also I know, but iptables is another complicated mess I think.

# Pls set working directory to this project! Otherwise you may experience files missing on your client!

